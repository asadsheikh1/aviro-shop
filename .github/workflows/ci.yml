name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  stack:
    name: full stack + every fault reproduces (rootless Podman)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked
      - name: Install podman-compose
        run: |
          uv tool install podman-compose==1.6.0
          podman --version && podman-compose --version
          echo "PODMAN_COMPOSE_PROVIDER=$(command -v podman-compose)" >> "$GITHUB_ENV"
      - name: Build and start (with debug OTel collector)
        run: |
          podman compose build
          OTEL_EXPORTER=otlp podman compose --profile otel up -d
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ready":true' && exit 0
            sleep 2
          done
          podman compose logs; exit 1
      - name: Smoke tests (every fault + telemetry)
        env:
          AVIRO_REQUIRE_OTEL: "1"
        run: uv run pytest -m smoke -v
      - name: Logs on failure
        if: failure()
        run: |
          podman ps -a
          podman compose --profile otel logs --tail 80
