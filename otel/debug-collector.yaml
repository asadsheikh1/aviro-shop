# Local debug collector: receives OTLP from AVIRO and prints a summary of
# every batch. Only for checking that telemetry leaves the services; SENTINEL's
# ingestion gateway replaces it from SENTINEL Step 6.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed   # prints resource attributes (service.name) so tests can check them

service:
  pipelines:
    traces: { receivers: [otlp], processors: [batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [debug] }
    logs: { receivers: [otlp], processors: [batch], exporters: [debug] }
